<script>
  function loadSettings() {
    google.script.run.withSuccessHandler(renderEmployees).withFailureHandler(handleSettingsError).getEmployees();
    google.script.run.withSuccessHandler(renderServices).withFailureHandler(handleSettingsError).getServices();
  }
  function renderEmployees(items) {
    document.getElementById('employeeList').innerHTML = items.length ? items.map(function (item) {
      return '<div class="catalog-item"><div><strong>' + app.escape(item.FullName) + '</strong><small>' + app.escape(item.Role || '—') + ' · ' + app.escape(item.EmployeeID) + '</small></div><button class="icon-button danger" onclick="archiveEmployeeUi(\'' + app.escape(item.EmployeeID) + '\')">Lưu trữ</button></div>';
    }).join('') : '<div class="empty-state">Chưa có nhân viên.</div>';
  }
  function renderServices(items) {
    document.getElementById('serviceList').innerHTML = items.length ? items.map(function (item) {
      return '<div class="catalog-item"><div><strong>' + app.escape(item.ServiceName) + '</strong><small>' + app.escape(item.Duration) + ' phút · ' + app.currency(item.Price) + ' · ' + app.escape(item.ServiceID) + '</small></div><button class="icon-button danger" onclick="archiveServiceUi(\'' + app.escape(item.ServiceID) + '\')">Lưu trữ</button></div>';
    }).join('') : '<div class="empty-state">Chưa có dịch vụ.</div>';
  }
  function archiveEmployeeUi(id) { if (confirm('Lưu trữ nhân viên này?')) google.script.run.withSuccessHandler(loadSettings).withFailureHandler(handleSettingsError).archiveEmployee(id); }
  function archiveServiceUi(id) { if (confirm('Lưu trữ dịch vụ này?')) google.script.run.withSuccessHandler(loadSettings).withFailureHandler(handleSettingsError).archiveService(id); }
  function handleSettingsError(error) { app.toast(error && error.message ? error.message : 'Không thể cập nhật cài đặt.', 'error'); }
  document.addEventListener('DOMContentLoaded', function () {
    document.getElementById('employeeForm').addEventListener('submit', function (event) { event.preventDefault(); google.script.run.withSuccessHandler(function () { event.currentTarget.reset(); app.toast('Đã thêm nhân viên.'); loadSettings(); }).withFailureHandler(handleSettingsError).createEmployee(Object.fromEntries(new FormData(event.currentTarget).entries())); });
    document.getElementById('serviceForm').addEventListener('submit', function (event) { event.preventDefault(); google.script.run.withSuccessHandler(function () { event.currentTarget.reset(); app.toast('Đã thêm dịch vụ.'); loadSettings(); }).withFailureHandler(handleSettingsError).createService(Object.fromEntries(new FormData(event.currentTarget).entries())); });
  });
</script>
