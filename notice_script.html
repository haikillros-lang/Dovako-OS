<script>
  const noticeUi = { items: [], editingId: null, searchTimer: null };

  function noticeCanManage() {
    return Boolean(authUi.user) && ['Admin', 'Manager'].indexOf(authUi.user.Role) !== -1;
  }

  function noticeDateInput(value) { return dateUi.display(value); }

  function noticeDateLabel(value) {
    if (!value) return '';
    return dateUi.display(value);
  }

  function loadNotices() {
    const list = document.getElementById('noticeList');
    if (!list) return;
    list.innerHTML = '<div class="empty-state">Đang tải nội dung...</div>';
    const options = {
      Category: document.getElementById('noticeCategoryFilter').value,
      Status: noticeCanManage() ? document.getElementById('noticeStatusFilter').value : '',
      query: document.getElementById('noticeSearch').value
    };
    apiCall('getNotices', [options], renderNotices, function (error) {
      list.innerHTML = '<div class="empty-state">Không tải được nội dung.</div>';
      app.toast(error && error.message ? error.message : 'Không tải được bảng thông báo.', 'error');
    });
    if (typeof loadLeaveSchedules === 'function') loadLeaveSchedules();
  }

  function renderNotices(items) {
    noticeUi.items = items || [];
    const canManage = noticeCanManage();
    document.getElementById('noticeListSummary').textContent = noticeUi.items.length + ' nội dung' + (canManage ? ' đang quản lý' : ' đang hiệu lực');
    document.getElementById('noticeList').innerHTML = noticeUi.items.length ? noticeUi.items.map(function (item) {
      const schedule = 'Hiệu lực: ' + noticeDateLabel(item.EffectiveDate) + (item.ExpiryDate ? ' · đến ' + noticeDateLabel(item.ExpiryDate) : '');
      const actions = canManage
        ? '<div class="notice-actions"><button class="text-button" type="button" onclick="editNoticeUi(\'' + app.escape(item.NoticeID) + '\')">Sửa</button>' +
          (item.Status !== 'Lưu trữ' ? '<button class="icon-button danger" type="button" onclick="archiveNoticeUi(\'' + app.escape(item.NoticeID) + '\')">Lưu trữ</button>' : '') + '</div>'
        : '';
      return '<article class="notice-item notice-' + app.escape(item.Status === 'Lưu trữ' ? 'archived' : 'active') + '">' +
        '<div class="notice-item-head"><div><span class="notice-category">' + app.escape(item.Category) + '</span><h3>' + app.escape(item.Title) + '</h3></div><span class="status-chip' + (item.Status === 'Lưu trữ' ? ' inactive' : item.Status === 'Nháp' ? ' danger' : '') + '">' + app.escape(item.Status) + '</span></div>' +
        '<p class="notice-content">' + app.escape(item.Content).replace(/\n/g, '<br>') + '</p>' +
        '<div class="notice-item-foot"><span>' + app.escape(schedule) + '</span><span>Cập nhật: ' + app.escape(noticeDateLabel(item.UpdatedDate)) + (item.UpdatedBy ? ' · ' + app.escape(item.UpdatedBy) : '') + '</span></div>' + actions +
        '</article>';
    }).join('') : '<div class="empty-state">Chưa có nội dung phù hợp.</div>';
  }

  function editNoticeUi(id) {
    const item = noticeUi.items.find(function (value) { return value.NoticeID === id; });
    if (!item) { app.toast('Không tìm thấy nội dung cần sửa.', 'error'); return; }
    const form = document.getElementById('noticeForm');
    noticeUi.editingId = id;
    form.elements.Category.value = item.Category || 'Thông báo';
    form.elements.Status.value = item.Status || 'Đã đăng';
    form.elements.Title.value = item.Title || '';
    form.elements.EffectiveDate.value = noticeDateInput(item.EffectiveDate);
    form.elements.ExpiryDate.value = noticeDateInput(item.ExpiryDate);
    form.elements.Content.value = item.Content || '';
    document.getElementById('noticeEditorTitle').textContent = 'Cập nhật nội dung ' + id;
    document.getElementById('saveNoticeButton').textContent = 'Lưu thay đổi';
    document.getElementById('cancelNoticeEditButton').classList.remove('hidden');
    form.scrollIntoView({ behavior: 'smooth', block: 'start' });
    form.elements.Title.focus();
  }

  function cancelNoticeEditUi() {
    noticeUi.editingId = null;
    const form = document.getElementById('noticeForm');
    form.reset();
    form.elements.EffectiveDate.value = noticeDateInput(new Date().toISOString());
    form.elements.Status.value = 'Đã đăng';
    document.getElementById('noticeEditorTitle').textContent = 'Cập nhật bảng nội bộ';
    document.getElementById('saveNoticeButton').textContent = 'Đăng nội dung';
    document.getElementById('cancelNoticeEditButton').classList.add('hidden');
  }

  function archiveNoticeUi(id) {
    if (!window.confirm('Lưu trữ nội dung này? Nhân viên sẽ không còn thấy nội dung, nhưng Admin và Quản lý vẫn có thể xem lại.')) return;
    apiCall('archiveNotice', [id], function () {
      app.toast('Đã lưu trữ nội dung.');
      if (noticeUi.editingId === id) cancelNoticeEditUi();
      loadNotices();
    }, function (error) { app.toast(error.message || 'Không thể lưu trữ nội dung.', 'error'); });
  }

  document.addEventListener('DOMContentLoaded', function () {
    const form = document.getElementById('noticeForm');
    if (form) {
      form.elements.EffectiveDate.value = noticeDateInput(new Date().toISOString());
      form.addEventListener('submit', function (event) {
        event.preventDefault();
        const data = Object.fromEntries(new FormData(form).entries());
        const button = document.getElementById('saveNoticeButton');
        button.disabled = true;
        const editingId = noticeUi.editingId;
        const method = editingId ? 'updateNotice' : 'createNotice';
        const args = editingId ? [editingId, data] : [data];
        apiCall(method, args, function () {
          button.disabled = false;
          app.toast(editingId ? 'Đã cập nhật nội dung.' : 'Đã đăng nội dung.');
          cancelNoticeEditUi();
          loadNotices();
        }, function (error) {
          button.disabled = false;
          app.toast(error.message || 'Không thể lưu nội dung.', 'error');
        });
      });
    }
    const search = document.getElementById('noticeSearch');
    if (search) search.addEventListener('input', function () {
      window.clearTimeout(noticeUi.searchTimer);
      noticeUi.searchTimer = window.setTimeout(loadNotices, 250);
    });
  });
</script>
<script>
  const leaveUi = { items: [], employees: [], editingId: null, employeesLoaded: false, searchTimer: null, pickerTarget: '', pickerMonth: null };

  function leaveCanManage() { return noticeCanManage(); }
  function leaveDateInput(value) { return dateUi.display(value); }
  function leaveDateLabel(value) {
    if (!value) return '';
    return dateUi.display(value);
  }

  function leaveDateKey(value) {
    const date = dateUi.parse(value);
    return date ? date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0') : '';
  }

  function leaveMonthValue(date) {
    return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0');
  }

  function openLeaveDatePicker(target) {
    const form = document.getElementById('leaveForm');
    if (!form || !form.elements[target]) return;
    const selected = dateUi.parse(form.elements[target].value) || new Date();
    leaveUi.pickerTarget = target;
    leaveUi.pickerMonth = new Date(selected.getFullYear(), selected.getMonth(), 1);
    document.getElementById('leaveDatePicker').classList.remove('hidden');
    renderLeaveDatePicker();
  }

  function closeLeaveDatePicker() {
    leaveUi.pickerTarget = '';
    document.getElementById('leaveDatePicker').classList.add('hidden');
  }

  function moveLeaveDatePicker(months) {
    const current = leaveUi.pickerMonth || new Date();
    leaveUi.pickerMonth = new Date(current.getFullYear(), current.getMonth() + Number(months || 0), 1);
    renderLeaveDatePicker();
  }

  function renderLeaveDatePicker() {
    const month = leaveUi.pickerMonth || new Date();
    const year = month.getFullYear();
    const monthIndex = month.getMonth();
    const firstDay = (new Date(year, monthIndex, 1).getDay() + 6) % 7;
    const days = new Date(year, monthIndex + 1, 0).getDate();
    const form = document.getElementById('leaveForm');
    const start = leaveDateKey(form.elements.StartDate.value);
    const end = leaveDateKey(form.elements.EndDate.value);
    const today = leaveDateKey(new Date());
    document.getElementById('leavePickerMonthLabel').textContent = new Intl.DateTimeFormat('vi-VN', { month: 'long', year: 'numeric' }).format(month);
    const cells = [];
    for (let index = 0; index < firstDay; index += 1) cells.push('<td class="outside-month"></td>');
    for (let day = 1; day <= days; day += 1) {
      const key = year + '-' + String(monthIndex + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
      const classes = [key === today ? 'today' : '', key === start ? 'selected-start' : '', key === end ? 'selected-end' : '', start && end && key > start && key < end ? 'selected-range' : ''].filter(Boolean).join(' ');
      cells.push('<td><button type="button" class="' + classes + '" onclick="selectLeavePickerDate(\'' + key + '\')">' + day + '</button></td>');
    }
    while (cells.length % 7) cells.push('<td class="outside-month"></td>');
    const body = document.getElementById('leavePickerCalendarBody');
    let rows = '';
    for (let index = 0; index < cells.length; index += 7) rows += '<tr>' + cells.slice(index, index + 7).join('') + '</tr>';
    body.innerHTML = rows;
  }

  function selectLeavePickerDate(key) {
    const form = document.getElementById('leaveForm');
    if (!leaveUi.pickerTarget || !form) return;
    const target = leaveUi.pickerTarget;
    form.elements[target].value = dateUi.display(key);
    const start = leaveDateKey(form.elements.StartDate.value);
    const end = leaveDateKey(form.elements.EndDate.value);
    if (target === 'StartDate' && end && key > end) form.elements.EndDate.value = dateUi.display(key);
    if (target === 'EndDate' && start && key < start) form.elements.StartDate.value = dateUi.display(key);
    closeLeaveDatePicker();
  }

  function loadLeaveSchedules() {
    const list = document.getElementById('leaveList');
    if (!list) return;
    list.innerHTML = '<div class="empty-state">Đang tải lịch nghỉ...</div>';
    const options = {
      month: document.getElementById('leaveMonth').value,
      Status: leaveCanManage() ? document.getElementById('leaveStatusFilter').value : '',
      query: document.getElementById('leaveSearch').value
    };
    apiCall('getLeaveSchedules', [options], renderLeaveSchedules, function (error) {
      list.innerHTML = '<div class="empty-state">Không tải được lịch nghỉ.</div>';
      app.toast(error && error.message ? error.message : 'Không tải được lịch nghỉ.', 'error');
    });
    if (leaveCanManage()) loadLeaveEmployees();
  }

  function loadLeaveEmployees() {
    if (leaveUi.employeesLoaded) return;
    apiCall('getEmployees', [false], function (employees) {
      leaveUi.employees = employees || [];
      leaveUi.employeesLoaded = true;
      renderLeaveEmployeeOptions();
    }, function (error) { app.toast(error.message || 'Không tải được danh sách nhân viên.', 'error'); });
  }

  function renderLeaveEmployeeOptions() {
    const select = document.querySelector('#leaveForm select[name="EmployeeID"]');
    if (!select) return;
    const selected = select.value;
    select.innerHTML = '<option value="">Chọn nhân viên</option>' + leaveUi.employees.map(function (employee) {
      return '<option value="' + app.escape(employee.EmployeeID) + '">' + app.escape(employee.FullName) + ' · ' + app.escape(employee.Role || 'Nhân viên') + '</option>';
    }).join('');
    select.value = selected;
  }

  function renderLeaveSchedules(items) {
    leaveUi.items = items || [];
    const canManage = leaveCanManage();
    document.getElementById('leaveListSummary').textContent = leaveUi.items.length + ' lịch nghỉ' + (canManage ? ' đang quản lý' : ' đã công bố');
    document.getElementById('leaveList').innerHTML = leaveUi.items.length ? leaveUi.items.map(function (item) {
      const range = leaveDateLabel(item.StartDate) + (leaveDateInput(item.StartDate) !== leaveDateInput(item.EndDate) ? ' – ' + leaveDateLabel(item.EndDate) : '');
      const actions = canManage ? '<div class="notice-actions"><button class="text-button" type="button" onclick="editLeaveUi(\'' + app.escape(item.LeaveID) + '\')">Sửa</button>' + (item.Status !== 'Lưu trữ' ? '<button class="icon-button danger" type="button" onclick="archiveLeaveUi(\'' + app.escape(item.LeaveID) + '\')">Lưu trữ</button>' : '') + '</div>' : '';
      return '<article class="leave-item' + (item.Status === 'Lưu trữ' ? ' leave-archived' : '') + '">' +
        '<div class="leave-item-head"><div><h3>' + app.escape(item.EmployeeName) + '</h3><p>' + app.escape(range) + '</p></div><span class="status-chip' + (item.Status === 'Lưu trữ' ? ' inactive' : item.Status === 'Nháp' ? ' danger' : '') + '">' + app.escape(item.Status) + '</span></div>' +
        '<p class="notice-content">' + app.escape(item.Reason).replace(/\n/g, '<br>') + '</p>' +
        '<div class="notice-item-foot"><span>Mã lịch: ' + app.escape(item.LeaveID) + '</span><span>Cập nhật: ' + app.escape(leaveDateLabel(item.UpdatedDate)) + (item.UpdatedBy ? ' · ' + app.escape(item.UpdatedBy) : '') + '</span></div>' + actions +
        '</article>';
    }).join('') : '<div class="empty-state">Không có lịch nghỉ phù hợp.</div>';
    renderLeaveMonthCalendar();
  }

  function renderLeaveMonthCalendar() {
    const container = document.getElementById('leaveMonthCalendar');
    const monthInput = document.getElementById('leaveMonth');
    if (!container || !monthInput || !/^\d{4}-\d{2}$/.test(monthInput.value)) return;
    const parts = monthInput.value.split('-').map(Number);
    const year = parts[0];
    const monthIndex = parts[1] - 1;
    const firstDay = (new Date(year, monthIndex, 1).getDay() + 6) % 7;
    const days = new Date(year, monthIndex + 1, 0).getDate();
    const today = leaveDateKey(new Date());
    const recordMap = {};
    leaveUi.items.filter(function (item) { return item.Status !== 'Lưu trữ'; }).forEach(function (item) {
      const start = leaveDateKey(item.StartDate);
      const end = leaveDateKey(item.EndDate || item.StartDate);
      for (let day = new Date(year, monthIndex, 1); day.getMonth() === monthIndex; day.setDate(day.getDate() + 1)) {
        const key = leaveDateKey(day);
        if (start <= key && end >= key) (recordMap[key] = recordMap[key] || []).push(item);
      }
    });
    const cells = [];
    for (let index = 0; index < firstDay; index += 1) cells.push('<td class="outside-month"></td>');
    for (let day = 1; day <= days; day += 1) {
      const key = year + '-' + String(monthIndex + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
      const records = recordMap[key] || [];
      const lines = records.slice(0, 3).map(function (item) {
        return '<span class="leave-calendar-name' + (item.Status === 'Nháp' ? ' draft' : '') + '">' + app.escape(item.EmployeeName) + '</span>';
      }).join('') + (records.length > 3 ? '<span class="leave-calendar-more">+' + (records.length - 3) + '</span>' : '');
      cells.push('<td class="leave-calendar-day' + (key === today ? ' today' : '') + (records.length ? ' has-leave' : '') + '"><strong>' + day + '</strong><div class="leave-calendar-names">' + lines + '</div></td>');
    }
    while (cells.length % 7) cells.push('<td class="outside-month"></td>');
    let rows = '';
    for (let index = 0; index < cells.length; index += 7) rows += '<tr>' + cells.slice(index, index + 7).join('') + '</tr>';
    container.innerHTML = '<h3>Ngày nghỉ trong tháng ' + app.escape(String(parts[1]).padStart(2, '0') + '/' + year) + '</h3><div class="leave-calendar-scroll"><table class="leave-month-calendar"><thead><tr><th>T2</th><th>T3</th><th>T4</th><th>T5</th><th>T6</th><th>T7</th><th>CN</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  function editLeaveUi(id) {
    const item = leaveUi.items.find(function (value) { return value.LeaveID === id; });
    if (!item) { app.toast('Không tìm thấy lịch nghỉ cần sửa.', 'error'); return; }
    const form = document.getElementById('leaveForm');
    leaveUi.editingId = id;
    form.elements.EmployeeID.value = item.EmployeeID || '';
    form.elements.StartDate.value = leaveDateInput(item.StartDate);
    form.elements.EndDate.value = leaveDateInput(item.EndDate);
    form.elements.Status.value = item.Status || 'Đã đăng';
    form.elements.Reason.value = item.Reason || '';
    document.getElementById('leaveEditorTitle').textContent = 'Cập nhật lịch nghỉ ' + id;
    document.getElementById('saveLeaveButton').textContent = 'Lưu thay đổi';
    document.getElementById('cancelLeaveEditButton').classList.remove('hidden');
    closeLeaveDatePicker();
    form.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function cancelLeaveEditUi() {
    leaveUi.editingId = null;
    const form = document.getElementById('leaveForm');
    form.reset();
    const today = dateUi.today();
    form.elements.StartDate.value = today;
    form.elements.EndDate.value = today;
    form.elements.Status.value = 'Đã đăng';
    document.getElementById('leaveEditorTitle').textContent = 'Cập nhật lịch nghỉ nhân viên';
    document.getElementById('saveLeaveButton').textContent = 'Đăng lịch nghỉ';
    document.getElementById('cancelLeaveEditButton').classList.add('hidden');
    closeLeaveDatePicker();
  }

  function archiveLeaveUi(id) {
    if (!window.confirm('Lưu trữ lịch nghỉ này? Nhân viên sẽ không còn thấy lịch trên bảng thông báo.')) return;
    apiCall('archiveLeaveSchedule', [id], function () {
      app.toast('Đã lưu trữ lịch nghỉ.');
      if (leaveUi.editingId === id) cancelLeaveEditUi();
      loadLeaveSchedules();
    }, function (error) { app.toast(error.message || 'Không thể lưu trữ lịch nghỉ.', 'error'); });
  }

  document.addEventListener('DOMContentLoaded', function () {
    const form = document.getElementById('leaveForm');
    const month = document.getElementById('leaveMonth');
    if (month) month.value = leaveMonthValue(new Date());
    if (form) {
      cancelLeaveEditUi();
      form.addEventListener('submit', function (event) {
        event.preventDefault();
        const data = Object.fromEntries(new FormData(form).entries());
        const button = document.getElementById('saveLeaveButton');
        button.disabled = true;
        const editingId = leaveUi.editingId;
        apiCall(editingId ? 'updateLeaveSchedule' : 'createLeaveSchedule', editingId ? [editingId, data] : [data], function () {
          button.disabled = false;
          app.toast(editingId ? 'Đã cập nhật lịch nghỉ.' : 'Đã đăng lịch nghỉ.');
          cancelLeaveEditUi();
          loadLeaveSchedules();
        }, function (error) {
          button.disabled = false;
          app.toast(error.message || 'Không thể lưu lịch nghỉ.', 'error');
        });
      });
    }
    const search = document.getElementById('leaveSearch');
    if (search) search.addEventListener('input', function () {
      window.clearTimeout(leaveUi.searchTimer);
      leaveUi.searchTimer = window.setTimeout(loadLeaveSchedules, 250);
    });
  });
</script>
