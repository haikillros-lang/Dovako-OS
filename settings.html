<div class="settings-grid">
  <section class="panel"><div class="panel-head compact"><div><h2>Nhân viên</h2><p>Danh sách để phân công booking.</p></div><div class="panel-actions"><button type="button" class="button ghost" data-roles="Admin" onclick="repairCatalogIdsUi()">Sửa mã trùng</button><button type="button" class="button danger" data-roles="Admin" onclick="purgeUnlinkedEmployeesUi()">Xóa dữ liệu nhân sự</button></div></div>
    <form id="employeeForm" class="inline-form"><input name="FullName" required placeholder="Tên nhân viên"><input name="Phone" inputmode="tel" placeholder="Số điện thoại"><input name="Role" placeholder="Vai trò / KTV"><button class="button primary">Thêm</button></form>
    <div id="employeeList" class="catalog-list"></div>
  </section>
  <section class="panel"><div class="panel-head compact"><div><h2>Dịch vụ</h2><p>Giá và thời lượng tự điền vào Booking.</p></div></div>
    <form id="serviceForm" class="inline-form services"><input name="ServiceName" required placeholder="Tên dịch vụ"><input name="Duration" type="number" min="1" required placeholder="Phút"><input name="Price" type="number" min="0" required placeholder="Giá"><button class="button primary">Thêm</button></form>
    <div id="serviceList" class="catalog-list"></div>
  </section>
  <section class="panel account-panel" data-roles="Admin"><div class="panel-head compact"><div><h2>Tài khoản & phân quyền</h2><p>Chỉ Admin có thể tạo hoặc khóa tài khoản.</p></div><button type="button" class="button ghost" onclick="repairDuplicateUsersUi()">Sửa tài khoản trùng</button></div>
    <form id="userForm" class="user-form"><input name="FullName" required placeholder="Họ và tên"><input name="Username" required placeholder="Tên đăng nhập"><input id="userPassword" name="Password" type="password" minlength="8" placeholder="Mật khẩu (từ 8 ký tự)"><select name="Role" required><option value="Reception">Lễ tân</option><option value="Technician">Kỹ thuật viên</option><option value="Manager">Quản lý</option><option value="Admin">Admin</option></select><select id="userEmployee" name="EmployeeID"><option value="">Không liên kết nhân viên</option></select><button id="saveUserButton" class="button primary">Tạo tài khoản</button><button id="cancelUserEditButton" class="button secondary hidden" type="button" onclick="cancelUserEditUi()">Hủy</button></form>
    <div id="userList" class="catalog-list"></div>
  </section>
</div>
