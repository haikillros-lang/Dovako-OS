<script>
  const bookingUi = {
    options: { customers: [], employees: [], services: [], beds: [] },
    availability: null,
    prepaidCards: [],
    timer: null,
    customerResults: [],
    customerSearchTimer: null,
    cardOwnerResults: [],
    cardOwnerSearchTimer: null,
    autoDiscount: 0,
    groupGuestResults: [],
    groupGuestSearchTimer: null,
    groupParticipants: [],
    additionalEmployeeIds: [],
    prepaidReceipt: null
  };

  function loadBookingScreen() {
    loadBookingOptionsForDate(function () {
      loadBookings();
      loadBookingAvailability();
    });
  }

  function loadBookingOptionsForDate(done) {
    const date = document.getElementById('bookingDate').value || dateUi.today();
    apiCall('getBookingOptions', [{ date: date }], function (options) {
      bookingUi.options = options || bookingUi.options;
      renderBookingOptions();
      if (typeof done === 'function') done();
    }, handleBookingError);
  }

  function renderBookingOptions() {
    const options = bookingUi.options;
    fillSelect('bookingEmployee', options.employees, 'EmployeeID', function (item) { return item.FullName + (item.Role ? ' · ' + item.Role : ''); });
    fillSelect('bookingService', options.services, 'ServiceID', function (item) { return item.ServiceName + ' · ' + app.currency(item.Price); });
    const bed = document.getElementById('bookingBed');
    bed.innerHTML = '<option value="">Chọn giường</option>' + (options.beds || []).map(function (item) { return '<option value="' + app.escape(item) + '">Giường ' + app.escape(item) + '</option>'; }).join('');
    const missing = [];
    if (!options.employees || !options.employees.length) missing.push('nhân viên');
    if (!options.services || !options.services.length) missing.push('dịch vụ');
    const notice = document.getElementById('bookingSetupNotice');
    notice.classList.toggle('hidden', !missing.length);
    notice.textContent = missing.length ? 'Cần thêm ' + missing.join(' và ') + ' trong mục Cài đặt trước khi tạo booking.' : '';
    refreshBookingResourceChoices();
  }

  function fillSelect(id, values, idKey, label) {
    const select = document.getElementById(id);
    const current = select.value;
    select.innerHTML = '<option value="">Chọn</option>' + (values || []).map(function (item) {
      return '<option value="' + app.escape(item[idKey]) + '">' + app.escape(label(item)) + '</option>';
    }).join('');
    select.value = current;
  }

  function searchBookingCustomers() {
    const input = document.getElementById('bookingCustomerSearch');
    const query = input.value.trim();
    const results = document.getElementById('bookingCustomerResults');
    document.getElementById('bookingCustomer').value = '';
    document.getElementById('bookingCustomerSelected').textContent = query ? 'Đang tìm khách...' : 'Nhập tên, SĐT hoặc mã khách để tìm.';
    if (query.length < 2) {
      results.classList.add('hidden');
      document.getElementById('bookingCustomerSelected').textContent = 'Nhập tối thiểu 2 ký tự để tìm nhanh trong toàn bộ hồ sơ.';
      return;
    }
    apiCall('searchCustomers', [query, { limit: 15 }], renderBookingCustomerResults, handleBookingError);
  }

  function renderBookingCustomerResults(customers) {
    bookingUi.customerResults = customers || [];
    const results = document.getElementById('bookingCustomerResults');
    if (!bookingUi.customerResults.length) {
      results.innerHTML = '<div class="customer-picker-empty">Không tìm thấy khách phù hợp.</div>';
      results.classList.remove('hidden');
      return;
    }
    results.innerHTML = bookingUi.customerResults.map(function (customer, index) {
      return '<button type="button" class="customer-picker-item" onclick="selectBookingCustomerByIndex(' + index + ')"><strong>' + app.escape(customer.FullName) + '</strong><small>' + app.escape(customer.Phone) + ' · ' + app.escape(customer.CustomerID) + '</small></button>';
    }).join('');
    results.classList.remove('hidden');
  }

  function selectBookingCustomerByIndex(index) {
    const customer = bookingUi.customerResults[index];
    if (!customer) return;
    document.getElementById('bookingCustomer').value = customer.CustomerID;
    document.getElementById('bookingCustomerSearch').value = customer.FullName + ' · ' + customer.Phone;
    document.getElementById('bookingCustomerSelected').textContent = 'Đã chọn: ' + customer.FullName + ' · ' + customer.Phone + ' · ' + customer.CustomerID;
    document.getElementById('bookingCustomerResults').classList.add('hidden');
    bookingUi.groupParticipants = bookingUi.groupParticipants.filter(function (participant) { return participant.CustomerID !== customer.CustomerID; });
    renderGroupAssignments();
    loadBookingPrepaid();
  }

  function toggleBookingGroup() {
    const enabled = document.getElementById('bookingGroupEnabled').checked;
    document.getElementById('bookingGroupGuestField').classList.toggle('hidden', !enabled);
    document.getElementById('bookingGroupAssignments').classList.toggle('hidden', !enabled);
    if (!enabled) {
      bookingUi.groupParticipants = [];
      document.getElementById('bookingGroupGuestSearch').value = '';
      document.getElementById('bookingGroupGuestResults').classList.add('hidden');
    }
    renderGroupAssignments();
    refreshBookingResourceChoices();
    updateBookingGroupPricing();
  }

  function searchBookingGroupGuests() {
    const input = document.getElementById('bookingGroupGuestSearch');
    const query = input.value.trim();
    const results = document.getElementById('bookingGroupGuestResults');
    if (query.length < 2) {
      results.classList.add('hidden');
      return;
    }
    results.innerHTML = '<div class="customer-picker-empty">Đang tìm khách...</div>';
    results.classList.remove('hidden');
    apiCall('searchCustomers', [query, { limit: 15 }], function (customers) {
      bookingUi.groupGuestResults = (customers || []).filter(function (customer) {
        return customer.CustomerID !== document.getElementById('bookingCustomer').value &&
          !bookingUi.groupParticipants.some(function (participant) { return participant.CustomerID === customer.CustomerID; });
      });
      results.innerHTML = bookingUi.groupGuestResults.length
        ? bookingUi.groupGuestResults.map(function (customer, index) {
          return '<button type="button" class="customer-picker-item" onclick="addBookingGroupGuestByIndex(' + index + ')"><strong>' + app.escape(customer.FullName) + '</strong><small>' + app.escape(customer.Phone) + ' · ' + app.escape(customer.CustomerID) + '</small></button>';
        }).join('')
        : '<div class="customer-picker-empty">Không còn khách phù hợp để thêm vào nhóm.</div>';
    }, handleBookingError);
  }

  function addBookingGroupGuestByIndex(index) {
    const customer = bookingUi.groupGuestResults[index];
    if (!customer) return;
    if (!document.getElementById('bookingCustomer').value) {
      app.toast('Hãy chọn khách chính trước khi thêm người đi cùng.', 'error');
      return;
    }
    bookingUi.groupParticipants.push({
      CustomerID: customer.CustomerID,
      FullName: customer.FullName,
      Phone: customer.Phone,
      EmployeeID: '',
      BedID: ''
    });
    document.getElementById('bookingGroupGuestSearch').value = '';
    document.getElementById('bookingGroupGuestResults').classList.add('hidden');
    bookingUi.groupGuestResults = [];
    renderGroupAssignments();
    refreshBookingResourceChoices();
    updateBookingGroupPricing();
  }

  function removeBookingGroupGuest(index) {
    bookingUi.groupParticipants.splice(index, 1);
    renderGroupAssignments();
    refreshBookingResourceChoices();
    updateBookingGroupPricing();
  }

  function updateBookingGroupGuest(index, field, value) {
    const participant = bookingUi.groupParticipants[index];
    if (!participant) return;
    participant[field] = value;
    if (field === 'EmployeeID') {
      bookingUi.additionalEmployeeIds = bookingUi.additionalEmployeeIds.filter(function (employeeId) { return employeeId !== value; });
    }
    renderGroupAssignments();
    refreshBookingResourceChoices();
  }

  function toggleBookingMultipleStaff() {
    const enabled = document.getElementById('bookingMultipleStaff').checked;
    document.getElementById('bookingAdditionalStaffField').classList.toggle('hidden', !enabled);
    if (!enabled) bookingUi.additionalEmployeeIds = [];
    renderAdditionalEmployeeOptions();
    refreshBookingResourceChoices();
  }

  function toggleAdditionalBookingEmployee(employeeId, checked) {
    const id = String(employeeId || '');
    bookingUi.additionalEmployeeIds = checked
      ? bookingUi.additionalEmployeeIds.concat([id]).filter(function (item, index, all) { return all.indexOf(item) === index; })
      : bookingUi.additionalEmployeeIds.filter(function (item) { return item !== id; });
    refreshBookingResourceChoices();
  }

  function toggleBookingFamilyCard() {
    const enabled = document.getElementById('bookingUseFamilyCard').checked;
    const field = document.getElementById('bookingCardOwnerField');
    field.classList.toggle('hidden', !enabled);
    if (!enabled) {
      clearBookingCardOwner();
    } else {
      document.getElementById('bookingCardOwnerSearch').focus();
    }
    loadBookingPrepaid();
  }

  function clearBookingCardOwner() {
    document.getElementById('bookingCardOwner').value = '';
    document.getElementById('bookingCardOwnerSearch').value = '';
    document.getElementById('bookingCardOwnerSelected').textContent = 'Chưa chọn chủ thẻ.';
    document.getElementById('bookingCardOwnerResults').classList.add('hidden');
    bookingUi.cardOwnerResults = [];
  }

  function resetBookingCardOwner() {
    document.getElementById('bookingUseFamilyCard').checked = false;
    document.getElementById('bookingCardOwnerField').classList.add('hidden');
    clearBookingCardOwner();
  }

  function searchBookingCardOwners() {
    const input = document.getElementById('bookingCardOwnerSearch');
    const query = input.value.trim();
    const results = document.getElementById('bookingCardOwnerResults');
    document.getElementById('bookingCardOwner').value = '';
    document.getElementById('bookingCardOwnerSelected').textContent = query ? 'Đang tìm chủ thẻ...' : 'Nhập tên, SĐT hoặc mã chủ thẻ để tìm.';
    if (query.length < 2) {
      results.classList.add('hidden');
      document.getElementById('bookingCardOwnerSelected').textContent = 'Nhập tối thiểu 2 ký tự để tìm nhanh chủ thẻ.';
      return;
    }
    apiCall('searchCustomers', [query, { limit: 15 }], renderBookingCardOwnerResults, handleBookingError);
  }

  function renderBookingCardOwnerResults(customers) {
    bookingUi.cardOwnerResults = customers || [];
    const results = document.getElementById('bookingCardOwnerResults');
    if (!bookingUi.cardOwnerResults.length) {
      results.innerHTML = '<div class="customer-picker-empty">Không tìm thấy chủ thẻ phù hợp.</div>';
      results.classList.remove('hidden');
      return;
    }
    results.innerHTML = bookingUi.cardOwnerResults.map(function (customer, index) {
      return '<button type="button" class="customer-picker-item" onclick="selectBookingCardOwnerByIndex(' + index + ')"><strong>' + app.escape(customer.FullName) + '</strong><small>' + app.escape(customer.Phone) + ' · ' + app.escape(customer.CustomerID) + '</small></button>';
    }).join('');
    results.classList.remove('hidden');
  }

  function selectBookingCardOwnerByIndex(index) {
    const customer = bookingUi.cardOwnerResults[index];
    if (!customer) return;
    const serviceCustomerId = document.getElementById('bookingCustomer').value;
    if (customer.CustomerID === serviceCustomerId) {
      app.toast('Người sử dụng dịch vụ đã là chủ thẻ. Không cần chọn thẻ người thân.', 'error');
      clearBookingCardOwner();
      return;
    }
    document.getElementById('bookingCardOwner').value = customer.CustomerID;
    document.getElementById('bookingCardOwnerSearch').value = customer.FullName + ' · ' + customer.Phone;
    document.getElementById('bookingCardOwnerSelected').textContent = 'Dùng thẻ của: ' + customer.FullName + ' · ' + customer.Phone + ' · ' + customer.CustomerID;
    document.getElementById('bookingCardOwnerResults').classList.add('hidden');
    loadBookingPrepaid();
  }

  function bookingPrepaidCustomerId() {
    return document.getElementById('bookingCardOwner').value || document.getElementById('bookingCustomer').value;
  }

  function bookingCardOwnerLabel() {
    const owner = document.getElementById('bookingCardOwner').value;
    const text = document.getElementById('bookingCardOwnerSearch').value;
    return owner ? (text || owner) : '';
  }

  function loadBookings() {
    const date = document.getElementById('bookingFilterDate').value;
    document.getElementById('bookingList').innerHTML = '<div class="empty-state">Đang tải...</div>';
    apiCall('getBookings', [{ date: date, includeCancelled: true }], function (bookings) {
      renderBookings(bookings);
      loadTechnicianEarnings();
    }, handleBookingError);
  }

  function loadBookingPrepaid() {
    const customerId = document.getElementById('bookingCustomer').value;
    const prepaidCustomerId = bookingPrepaidCustomerId();
    const usesFamilyCard = Boolean(document.getElementById('bookingCardOwner').value);
    const serviceId = document.getElementById('bookingService').value;
    const notice = document.getElementById('bookingPrepaidNotice');
    if (!customerId || !prepaidCustomerId || !serviceId) {
      bookingUi.prepaidCards = [];
      notice.classList.add('hidden');
      return;
    }
    notice.classList.remove('hidden');
    notice.textContent = 'Đang kiểm tra thẻ trả trước...';
    const amount = Number(document.getElementById('bookingPrice').value || 0);
    apiCall('getPrepaidBookingPreview', [prepaidCustomerId, serviceId, amount], function (preview) {
      bookingUi.prepaidCards = preview && preview.Usable ? [preview] : [];
      if (!preview || !preview.Usable) {
        clearAutomaticBookingDiscount();
        if ((preview && preview.HasCardHistory) || usesFamilyCard) {
          const subject = usesFamilyCard ? 'Thẻ của ' + bookingCardOwnerLabel() : 'Thẻ trả trước của khách';
          notice.textContent = subject + ' đã hết số dư/số buổi. Booking này không dùng được thẻ; cần thu thêm ' + app.currency(Number((preview && preview.OutstandingAmount) || amount)) + '.';
          notice.classList.remove('hidden');
        } else {
          notice.classList.add('hidden');
        }
        return;
      }
      const card = preview;
      const subject = usesFamilyCard ? 'Thẻ ' + card.CardID + ' của ' + bookingCardOwnerLabel() : 'Khách có thẻ ' + card.CardID;
      if (String(card.CardMode || '').toLowerCase() === 'value') {
        const suggested = Number(card.SuggestedDiscount || 0);
        applyAutomaticBookingDiscount(suggested);
        const charge = Number(card.ChargeAmount || amount);
        const applied = Number(card.AppliedValue || 0);
        const outstanding = Number(card.OutstandingAmount || 0);
        notice.textContent = outstanding > 0
          ? subject + ' còn ' + app.currency(card.RemainingValue) + '. Khi hoàn thành sẽ trừ hết ' + app.currency(applied) + ' từ thẻ và cần thu thêm ' + app.currency(outstanding) + '.'
          : (suggested > 0
            ? subject + ' giảm ' + app.currency(suggested) + ' cho buổi này. Khi hoàn thành sẽ trừ ' + app.currency(charge) + ', còn lại ' + app.currency(Math.max(0, Number(card.RemainingValue || 0) - applied)) + '.'
            : subject + ' còn ' + app.currency(card.RemainingValue) + '. Khi booking hoàn thành, hệ thống sẽ tự trừ ' + app.currency(charge) + '.');
      } else {
        clearAutomaticBookingDiscount();
        notice.textContent = subject + ' còn ' + card.RemainingSessions + ' buổi. Khi booking hoàn thành, hệ thống sẽ tự trừ 1 buổi.';
      }
    }, function () {
      bookingUi.prepaidCards = [];
      notice.classList.add('hidden');
    });
  }

  function selectedServiceDuration() {
    const service = (bookingUi.options.services || []).find(function (item) { return item.ServiceID === document.getElementById('bookingService').value; });
    return service ? Number(service.Duration || 0) : 0;
  }

  function bookingDuration() {
    const start = document.getElementById('bookingStart').value;
    const end = document.getElementById('bookingEnd').value;
    if (!start || !end) return selectedServiceDuration() || 60;
    const startPart = start.split(':').map(Number); const endPart = end.split(':').map(Number);
    const duration = (endPart[0] * 60 + endPart[1]) - (startPart[0] * 60 + startPart[1]);
    return duration > 0 ? duration : (selectedServiceDuration() || 60);
  }

  function loadBookingAvailability() {
    const date = document.getElementById('bookingDate').value;
    if (!date) return;
    document.getElementById('bookingAvailability').innerHTML = '<div class="empty-state">Đang tính lịch trống...</div>';
    apiCall('getBookingAvailability', [{ date: date, duration: bookingDuration() }], renderBookingAvailability, function (error) {
      document.getElementById('bookingAvailability').innerHTML = '<div class="empty-state">Không tải được lịch trống.</div>';
      handleBookingError(error);
    });
  }

  function renderBookingAvailability(data) {
    bookingUi.availability = data || { slots: [] };
    const slots = bookingUi.availability.slots || [];
    document.getElementById('availabilityCaption').textContent = (data.duration || 60) + ' phút · ' + (data.employeesConfigured || 0) + ' nhân viên đang hoạt động';
    if (!data.employeesConfigured) {
      document.getElementById('bookingAvailability').innerHTML = '<div class="empty-state">Chưa có nhân viên. Hãy thêm trong mục Cài đặt.</div>';
      return;
    }
    document.getElementById('bookingAvailability').innerHTML = slots.map(function (slot) {
      const names = slot.availableEmployees.map(function (employee) { return employee.FullName; });
      return '<article class="availability-item ' + (!slot.employeeCount || !slot.bedCount ? 'unavailable' : '') + '"><button type="button" onclick="useAvailabilitySlot(\'' + slot.StartTime + '\',\'' + slot.EndTime + '\')"><strong>' + app.escape(slot.StartTime) + ' – ' + app.escape(slot.EndTime) + '</strong><span>' + app.escape(names.length ? names.join(', ') : 'Không có nhân viên trống') + '</span><small>' + slot.bedCount + ' giường trống</small></button></article>';
    }).join('') || '<div class="empty-state">Không còn khung giờ phù hợp trong ngày này.</div>';
    applySelectedAvailability();
  }

  function matchingAvailabilitySlot() {
    const data = bookingUi.availability;
    if (!data || !data.slots) return null;
    const start = document.getElementById('bookingStart').value;
    const end = document.getElementById('bookingEnd').value;
    return data.slots.find(function (slot) { return slot.StartTime === start && slot.EndTime === end; }) || null;
  }

  function bookingResourcePool() {
    const slot = matchingAvailabilitySlot();
    return {
      employees: slot ? slot.availableEmployees : (bookingUi.options.employees || []),
      beds: slot ? slot.availableBeds : (bookingUi.options.beds || [])
    };
  }

  function groupEmployeeIds(excludedIndex) {
    return bookingUi.groupParticipants.reduce(function (ids, participant, index) {
      if (index !== excludedIndex && participant.EmployeeID) ids.push(String(participant.EmployeeID));
      return ids;
    }, []);
  }

  function groupBedIds(excludedIndex) {
    return bookingUi.groupParticipants.reduce(function (ids, participant, index) {
      if (index !== excludedIndex && participant.BedID) ids.push(String(participant.BedID));
      return ids;
    }, []);
  }

  function refreshBookingResourceChoices() {
    const pool = bookingResourcePool();
    const employee = document.getElementById('bookingEmployee');
    const bed = document.getElementById('bookingBed');
    if (!employee || !bed) return;
    const currentEmployee = employee.value;
    const currentBed = bed.value;
    const blockedEmployees = groupEmployeeIds().concat(bookingUi.additionalEmployeeIds || []);
    const primaryEmployees = pool.employees.filter(function (item) {
      return item.EmployeeID === currentEmployee || blockedEmployees.indexOf(String(item.EmployeeID)) === -1;
    });
    fillSelect('bookingEmployee', primaryEmployees, 'EmployeeID', function (item) {
      return item.FullName + (item.Role ? ' · ' + item.Role : '');
    });
    employee.value = currentEmployee;
    const blockedBeds = groupBedIds();
    const primaryBeds = pool.beds.filter(function (item) {
      return String(item) === String(currentBed) || blockedBeds.indexOf(String(item)) === -1;
    });
    bed.innerHTML = '<option value="">Chọn giường</option>' + primaryBeds.map(function (item) {
      return '<option value="' + app.escape(item) + '">Giường ' + app.escape(item) + '</option>';
    }).join('');
    bed.value = currentBed;
    if (bookingUi.additionalEmployeeIds.indexOf(employee.value) !== -1) {
      bookingUi.additionalEmployeeIds = bookingUi.additionalEmployeeIds.filter(function (item) { return item !== employee.value; });
    }
    renderAdditionalEmployeeOptions();
    renderGroupAssignments();
  }

  function renderAdditionalEmployeeOptions() {
    const container = document.getElementById('bookingAdditionalStaffOptions');
    const enabled = document.getElementById('bookingMultipleStaff').checked;
    if (!container) return;
    if (!enabled) { container.innerHTML = ''; return; }
    const pool = bookingResourcePool();
    const primaryEmployeeId = document.getElementById('bookingEmployee').value;
    const unavailable = groupEmployeeIds().concat(primaryEmployeeId ? [primaryEmployeeId] : []);
    bookingUi.additionalEmployeeIds = bookingUi.additionalEmployeeIds.filter(function (employeeId) {
      return unavailable.indexOf(employeeId) === -1 && pool.employees.some(function (item) { return item.EmployeeID === employeeId; });
    });
    const employees = pool.employees.filter(function (employee) { return unavailable.indexOf(String(employee.EmployeeID)) === -1; });
    container.innerHTML = employees.length ? employees.map(function (employee) {
      const id = String(employee.EmployeeID);
      const checked = bookingUi.additionalEmployeeIds.indexOf(id) !== -1 ? ' checked' : '';
      return '<label class="staff-choice"><input type="checkbox" value="' + app.escape(id) + '" onchange="toggleAdditionalBookingEmployee(this.value,this.checked)"' + checked + '><span>' + app.escape(employee.FullName) + (employee.Role ? ' · ' + app.escape(employee.Role) : '') + '</span></label>';
    }).join('') : '<small class="picker-hint">Không còn kỹ thuật viên trống trong khung giờ này.</small>';
  }

  function renderGroupAssignments() {
    const container = document.getElementById('bookingGroupAssignments');
    if (!container || !document.getElementById('bookingGroupEnabled').checked) {
      if (container) container.innerHTML = '';
      return;
    }
    if (!bookingUi.groupParticipants.length) {
      container.innerHTML = '<div class="group-assignment-empty">Chưa có người đi cùng. Tìm và thêm khách để tạo lịch nhóm.</div>';
      return;
    }
    const pool = bookingResourcePool();
    const primaryEmployeeId = document.getElementById('bookingEmployee').value;
    const primaryBedId = document.getElementById('bookingBed').value;
    container.innerHTML = '<div class="group-assignment-head"><strong>Phân công người đi cùng</strong><small>Mỗi người cần kỹ thuật viên và giường riêng.</small></div>' + bookingUi.groupParticipants.map(function (participant, index) {
      const otherEmployeeIds = groupEmployeeIds(index).concat(bookingUi.additionalEmployeeIds || []).concat(primaryEmployeeId ? [primaryEmployeeId] : []);
      const employees = pool.employees.filter(function (employee) {
        return employee.EmployeeID === participant.EmployeeID || otherEmployeeIds.indexOf(String(employee.EmployeeID)) === -1;
      });
      const otherBedIds = groupBedIds(index).concat(primaryBedId ? [primaryBedId] : []);
      const beds = pool.beds.filter(function (bed) {
        return String(bed) === String(participant.BedID) || otherBedIds.indexOf(String(bed)) === -1;
      });
      return '<article class="group-assignment-item"><div><strong>' + app.escape(participant.FullName) + '</strong><small>' + app.escape(participant.Phone) + ' · ' + app.escape(participant.CustomerID) + '</small></div><label><span>Kỹ thuật viên</span><select onchange="updateBookingGroupGuest(' + index + ',\'EmployeeID\',this.value)"><option value="">Chọn</option>' + employees.map(function (employee) { return '<option value="' + app.escape(employee.EmployeeID) + '"' + (employee.EmployeeID === participant.EmployeeID ? ' selected' : '') + '>' + app.escape(employee.FullName) + '</option>'; }).join('') + '</select></label><label><span>Giường</span><select onchange="updateBookingGroupGuest(' + index + ',\'BedID\',this.value)"><option value="">Chọn</option>' + beds.map(function (bed) { return '<option value="' + app.escape(bed) + '"' + (String(bed) === String(participant.BedID) ? ' selected' : '') + '>Giường ' + app.escape(bed) + '</option>'; }).join('') + '</select></label><button type="button" class="icon-button danger" onclick="removeBookingGroupGuest(' + index + ')">Bỏ</button></article>';
    }).join('');
  }

  function applySelectedAvailability() {
    refreshBookingResourceChoices();
  }

  function useAvailabilitySlot(startTime, endTime) {
    document.getElementById('bookingStart').value = startTime;
    document.getElementById('bookingEnd').value = endTime;
    applySelectedAvailability();
    document.getElementById('bookingEmployee').focus();
  }

  function renderBookings(bookings) {
    const customerMap = (bookingUi.options.customers || []).reduce(function (map, item) { map[item.CustomerID] = item.FullName; return map; }, {});
    const serviceMap = (bookingUi.options.services || []).reduce(function (map, item) { map[item.ServiceID] = item.ServiceName; return map; }, {});
    document.getElementById('bookingCount').textContent = (bookings || []).length + ' lịch';
    document.getElementById('bookingList').innerHTML = bookings && bookings.length ? bookings.map(function (booking) {
      const action = bookingAction(booking);
      const ownerId = booking.CardOwnerCustomerID || '';
      const familyCard = ownerId && ownerId !== booking.CustomerID
        ? '<small>Dùng thẻ: ' + app.escape(customerMap[ownerId] || ownerId) + '</small>' : '';
      const employeeNames = Array.isArray(booking.EmployeeNames) && booking.EmployeeNames.length

  function copyPrepaidReceipt() {
    const receipt = bookingUi.prepaidReceipt;
    if (!receipt || !receipt.Text) { app.toast('Chưa có phiếu thẻ để sao chép.', 'error'); return; }
    const copied = function () { app.toast('Đã sao chép phiếu. Bạn có thể dán vào Zalo để gửi khách.'); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(receipt.Text).then(copied).catch(function () { fallbackCopyReceipt(receipt.Text, copied); });
    } else {
      fallbackCopyReceipt(receipt.Text, copied);
    }
  }

  function fallbackCopyReceipt(value, done) {
    const area = document.createElement('textarea');
    area.value = value;
    area.setAttribute('readonly', '');
    area.style.position = 'fixed';
    area.style.opacity = '0';
    document.body.appendChild(area);
    area.select();
    try {
      document.execCommand('copy');
      done();
    } catch (error) {
      app.toast('Không thể sao chép tự động. Hãy chọn và sao chép nội dung phiếu.', 'error');
    }
    document.body.removeChild(area);
  }

  function bookingStatus(id, action) {
    const call = action === 'confirm' ? 'confirmBooking' : action === 'checkin' ? 'checkInBooking' : action === 'complete' ? 'completeBooking' : 'cancelBooking';
    const note = action === 'cancel' ? window.prompt('Lý do hủy lịch (không bắt buộc):') : null;
    if (action === 'cancel' && note === null) return;
    apiCall(call, action === 'cancel' ? [id, note] : [id], function (result) {
      const prepaid = result && result.Prepaid;
      const receipt = result && result.PrepaidReceipt;
      const receiptEmail = result && result.PrepaidReceiptEmail;
      const message = action === 'complete' && prepaid && prepaid.used
        ? 'Đã hoàn thành và trừ thẻ ' + prepaid.cardId + (prepaid.cardMode === 'Value'
          ? '. Còn ' + app.currency(prepaid.remainingValue) + '.'
          : (prepaid.remainingSessions === null ? '' : '. Còn ' + prepaid.remainingSessions + ' buổi.'))
        : 'Đã cập nhật trạng thái booking.';
      if (action === 'complete' && receipt) {
        showPrepaidReceipt(receipt, receiptEmail);
        if (receiptEmail && receiptEmail.sent) message += ' Phiếu đã gửi email.';
        else if (!receipt.CustomerEmail) message += ' Khách chưa có email; hãy sao chép phiếu để gửi Zalo.';
        else if (receiptEmail && receiptEmail.reason === 'SEND_FAILED') message += ' Chưa gửi được email; bạn có thể gửi lại.';
      }
      app.toast(message);
      loadBookings(); loadBookingAvailability(); app.loadDashboard();
    }, handleBookingError);
  }

  function handleBookingError(error) { app.toast(error && error.message ? error.message : 'Không thể xử lý booking.', 'error'); }

function bookingRecalculate() {
  const price = Number(document.getElementById('bookingPrice').value || 0);
  const discount = Number(document.getElementById('bookingDiscount').value || 0);
  document.getElementById('bookingFinalPrice').value = Math.max(0, price - discount);
  updateBookingGroupPricing();
}

function bookingGroupServiceUserCount() {
  const groupEnabled = document.getElementById('bookingGroupEnabled');
  return groupEnabled && groupEnabled.checked
    ? 1 + bookingUi.groupParticipants.length
    : 1;
}

function updateBookingGroupPricing() {
  const panel = document.getElementById('bookingGroupPricing');
  if (!panel) return;

  const customerCount = bookingGroupServiceUserCount();
  if (customerCount <= 1) {
    panel.classList.add('hidden');
    panel.innerHTML = '';
    return;
  }

  const pricePerCustomer = Number(document.getElementById('bookingPrice').value || 0);
  const discountPerCustomer = Number(document.getElementById('bookingDiscount').value || 0);
  const amountPerCustomer = Math.max(0, pricePerCustomer - discountPerCustomer);
  const totalBeforeDiscount = pricePerCustomer * customerCount;
  const totalDiscount = discountPerCustomer * customerCount;
  const totalAmount = amountPerCustomer * customerCount;

  panel.innerHTML =
    '<strong>Tổng tiền lịch nhóm · ' + customerCount + ' khách</strong>' +
    '<span>' + app.currency(pricePerCustomer) + ' × ' + customerCount +
      ' = ' + app.currency(totalBeforeDiscount) +
      (totalDiscount > 0 ? ' · giảm ' + app.currency(totalDiscount) : '') +
    '</span>' +
    '<b>Cần thu: ' + app.currency(totalAmount) + '</b>' +
    '<small>Thẻ trả trước được trừ riêng cho từng khách khi hoàn thành dịch vụ.</small>';
  panel.classList.remove('hidden');
}

  function bookingPayloadFromForm(form) {
    const data = Object.fromEntries(new FormData(form).entries());
    data.EmployeeIDs = [data.EmployeeID].concat(bookingUi.additionalEmployeeIds || []).filter(function (item, index, all) {
      return item && all.indexOf(item) === index;
    });
    if (document.getElementById('bookingGroupEnabled').checked && bookingUi.groupParticipants.length) {
      const missing = bookingUi.groupParticipants.some(function (participant) {
        return !participant.EmployeeID || !participant.BedID;
      });
      if (missing) throw new Error('Hãy chọn kỹ thuật viên và giường cho từng người đi cùng.');
      data.Participants = bookingUi.groupParticipants.map(function (participant) {
        return {
          CustomerID: participant.CustomerID,
          EmployeeID: participant.EmployeeID,
          EmployeeIDs: [participant.EmployeeID],
          BedID: participant.BedID
        };
      });
    }
    return data;
  }

        const count = result && Array.isArray(result.bookings) ? result.bookings.length : (isGroup ? data.Participants.length + 1 : 1);
        app.toast(isGroup ? 'Đã tạo ' + count + ' booking cho nhóm.' : 'Đã tạo booking.'); event.currentTarget.reset(); document.getElementById('bookingDate').value = today; document.getElementById('bookingCustomerSearch').value = ''; document.getElementById('bookingCustomer').value = ''; document.getElementById('bookingCustomerSelected').textContent = 'Chưa chọn khách hàng.'; resetBookingCardOwner(); resetBookingGroupState(); document.getElementById('bookingPrepaidNotice').classList.add('hidden'); bookingRecalculate(); loadBookingOptionsForDate(function () { loadBookings(); loadBookingAvailability(); }); app.loadDashboard(); button.disabled = false;
      }, function (error) { button.disabled = false; handleBookingError(error); });
    });
    document.getElementById('bookingService').addEventListener('change', bookingUseService);
    document.getElementById('bookingCustomerSearch').addEventListener('input', function () { window.clearTimeout(bookingUi.customerSearchTimer); bookingUi.customerSearchTimer = window.setTimeout(searchBookingCustomers, 250); });
    document.getElementById('bookingCustomerSearch').addEventListener('focus', function () { if (this.value.trim().length >= 2 && !document.getElementById('bookingCustomer').value) searchBookingCustomers(); });
    document.getElementById('bookingGroupEnabled').addEventListener('change', toggleBookingGroup);
    document.getElementById('bookingGroupGuestSearch').addEventListener('input', function () { window.clearTimeout(bookingUi.groupGuestSearchTimer); bookingUi.groupGuestSearchTimer = window.setTimeout(searchBookingGroupGuests, 250); });
    document.getElementById('bookingGroupGuestSearch').addEventListener('focus', function () { if (this.value.trim().length >= 2) searchBookingGroupGuests(); });
    document.getElementById('bookingUseFamilyCard').addEventListener('change', toggleBookingFamilyCard);
    document.getElementById('bookingMultipleStaff').addEventListener('change', toggleBookingMultipleStaff);
    document.getElementById('bookingCardOwnerSearch').addEventListener('input', function () { window.clearTimeout(bookingUi.cardOwnerSearchTimer); bookingUi.cardOwnerSearchTimer = window.setTimeout(searchBookingCardOwners, 250); });
    document.getElementById('bookingCardOwnerSearch').addEventListener('focus', function () { if (this.value.trim().length >= 2 && !document.getElementById('bookingCardOwner').value) searchBookingCardOwners(); });
    document.getElementById('bookingPrice').addEventListener('input', function () { bookingRecalculate(); loadBookingPrepaid(); });
    document.getElementById('bookingDiscount').addEventListener('input', function () { bookingUi.autoDiscount = null; bookingRecalculate(); loadBookingPrepaid(); });
    document.getElementById('bookingFilterDate').addEventListener('change', loadBookings);
    document.getElementById('bookingDate').addEventListener('change', function () {
      document.getElementById('bookingFilterDate').value = this.value;
      loadBookingOptionsForDate(function () { loadBookings(); loadBookingAvailability(); });
    });
    document.getElementById('bookingStart').addEventListener('change', loadBookingAvailability);
    document.getElementById('bookingEnd').addEventListener('change', loadBookingAvailability);
    document.getElementById('bookingEmployee').addEventListener('change', refreshBookingResourceChoices);
    document.getElementById('bookingBed').addEventListener('change', refreshBookingResourceChoices);
    const technicianBooking = document.getElementById('technicianAssessmentBooking');
    if (technicianBooking) technicianBooking.addEventListener('change', function () {
      document.getElementById('uploadTechnicianAssessmentButton').disabled = !this.value;
      loadTechnicianAssessmentFiles();
    });
    const technicianForm = document.getElementById('technicianAssessmentForm');
    if (technicianForm) technicianForm.addEventListener('submit', function (event) {
      event.preventDefault();
      const bookingId = document.getElementById('technicianAssessmentBooking').value;
      const input = document.getElementById('technicianAssessmentFile');
      const file = input.files && input.files[0];
      const button = document.getElementById('uploadTechnicianAssessmentButton');
      if (!bookingId) { app.toast('Hãy chọn booking được phân công cho bạn.', 'error'); return; }
      if (!file) { app.toast('Hãy chọn ảnh phiếu cập nhật.', 'error'); return; }
      if (!String(file.type || '').startsWith('image/')) { app.toast('Chỉ được tải lên ảnh phiếu.', 'error'); return; }
      if (file.size > 5 * 1024 * 1024) { app.toast('Ảnh tối đa 5 MB.', 'error'); return; }
      button.disabled = true;
      button.textContent = 'Đang đọc ảnh...';
      readTechnicianAssessmentFile(file).then(function (base64) {
        button.textContent = 'Đang lưu phiếu...';
        apiCall('uploadTechnicianBookingAssessment', [bookingId, {
          FileName: file.name,
          MimeType: file.type || 'image/jpeg',
          Base64: base64
        }], function () {
          input.value = '';
          button.disabled = false;
          button.textContent = 'Tải phiếu lên';
          app.toast('Đã lưu phiếu cập nhật vào hồ sơ khách.');
          loadTechnicianAssessmentFiles();
        }, function (error) {
          button.disabled = false;
          button.textContent = 'Tải phiếu lên';
          handleBookingError(error);
        });
      }).catch(function (error) {
        button.disabled = false;
        button.textContent = 'Tải phiếu lên';
        handleBookingError(error);
      });
    });
  });
</script>
