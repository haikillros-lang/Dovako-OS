    <script>
      const dateUi = {
        pad(value) { return String(value).padStart(2, '0'); },
        parse(value) {
          if (!value) return null;
          if (value instanceof Date) return new Date(value.getFullYear(), value.getMonth(), value.getDate(), 12);
          const text = String(value).trim();
          let match = text.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);
          if (match) return this.calendarDate(Number(match[3]), Number(match[2]), Number(match[1]));
          match = text.match(/^(\d{4})-(\d{2})-(\d{2})(?:$|T)/);
          if (match) return this.calendarDate(Number(match[1]), Number(match[2]), Number(match[3]));
          const date = new Date(text);
          return Number.isNaN(date.getTime()) ? null : date;
        },
        calendarDate(year, month, day) {
          const date = new Date(year, month - 1, day, 12);
          return date.getFullYear() === year && date.getMonth() === month - 1 && date.getDate() === day ? date : null;
        },
        display(value) {
          const date = this.parse(value);
          return date ? this.pad(date.getDate()) + '/' + this.pad(date.getMonth() + 1) + '/' + date.getFullYear() : '';
        },
        iso(value) {
          const date = this.parse(value);
          return date ? date.getFullYear() + '-' + this.pad(date.getMonth() + 1) + '-' + this.pad(date.getDate()) : '';
        },
        today() { return this.display(new Date()); },
        todayIso() { return this.iso(new Date()); },
        bind() {
          document.querySelectorAll('input[data-date-format="vi"]').forEach(function (input) {
            // Lịch nghỉ đã có bộ chọn ngày theo khoảng riêng. Các ô còn lại
            // dùng lịch chung để Chrome không đổi dd/mm thành mm/dd.
            if (input.closest('.leave-date-control')) return;
            const formatted = dateUi.display(input.value);
            if (formatted) input.value = formatted;
            input.type = 'text';
            input.readOnly = true;
            input.autocomplete = 'off';
            input.classList.add('vi-date-picker-input');
            input.setAttribute('aria-haspopup', 'dialog');
            input.removeAttribute('inputmode');
            input.removeAttribute('maxlength');
            input.removeAttribute('pattern');
            input.removeAttribute('placeholder');
            input.removeAttribute('data-date-format');
            input.addEventListener('click', function () { dateUi.open(input); });
            input.addEventListener('keydown', function (event) {
              if (event.key === 'Enter' || event.key === ' ' || event.key === 'ArrowDown') {
                event.preventDefault();
                dateUi.open(input);
              }
            });
          });
          this.ensurePicker();
        },
        ensurePicker() {
          if (document.getElementById('dovakoDatePicker')) return;
          const picker = document.createElement('div');
          picker.id = 'dovakoDatePicker';
          picker.className = 'dovako-date-picker hidden';
          picker.setAttribute('role', 'dialog');
          picker.setAttribute('aria-label', 'Chọn ngày');
          picker.innerHTML =
            '<div class="dovako-date-picker-head">' +
              '<button type="button" class="icon-button" data-date-action="previous" aria-label="Tháng trước">‹</button>' +
              '<span class="dovako-date-picker-period">' +
                '<select id="dovakoDatePickerMonth" aria-label="Chọn tháng"></select>' +
                '<select id="dovakoDatePickerYear" aria-label="Chọn năm"></select>' +
              '</span>' +
              '<span><button type="button" class="icon-button" data-date-action="today">Hôm nay</button><button type="button" class="icon-button" data-date-action="next" aria-label="Tháng sau">›</button></span>' +
            '</div>' +
            '<table class="dovako-date-picker-calendar"><thead><tr><th>T2</th><th>T3</th><th>T4</th><th>T5</th><th>T6</th><th>T7</th><th>CN</th></tr></thead><tbody id="dovakoDatePickerDays"></tbody></table>' +
            '<div class="dovako-date-picker-foot"><button type="button" class="text-button" data-date-action="clear">Xóa ngày</button><button type="button" class="text-button" data-date-action="close">Đóng</button></div>';
          document.body.appendChild(picker);
          picker.addEventListener('click', function (event) {
            const action = event.target && event.target.dataset ? event.target.dataset.dateAction : '';
            if (action === 'previous') dateUi.move(-1);
            if (action === 'next') dateUi.move(1);
            if (action === 'today') dateUi.select(dateUi.todayIso());
            if (action === 'clear') dateUi.clear();
            if (action === 'close') dateUi.close();
            const date = event.target && event.target.dataset ? event.target.dataset.date : '';
            if (date) dateUi.select(date);
          });
          picker.addEventListener('change', function (event) {
            const target = event.target;
            if (!target || (target.id !== 'dovakoDatePickerMonth' && target.id !== 'dovakoDatePickerYear')) return;
            const monthSelect = document.getElementById('dovakoDatePickerMonth');
            const yearSelect = document.getElementById('dovakoDatePickerYear');
            const year = Number(yearSelect && yearSelect.value);
            const month = Number(monthSelect && monthSelect.value);
            if (Number.isInteger(year) && Number.isInteger(month) && month >= 0 && month <= 11) {
              dateUi.setPeriod(year, month);
            }
          });
          document.addEventListener('mousedown', function (event) {
            const target = event.target;
            if (!dateUi.pickerTarget || picker.contains(target) || target === dateUi.pickerTarget) return;
            dateUi.close();
          });
          document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') dateUi.close();
          });
        },
        open(input) {
          if (!input || input.disabled) return;
          this.ensurePicker();
          const selected = this.parse(input.value) || new Date();
          this.pickerTarget = input;
          this.pickerMonth = new Date(selected.getFullYear(), selected.getMonth(), 1);
          document.getElementById('dovakoDatePicker').classList.remove('hidden');
          this.renderPicker();
        },
        close() {
          const picker = document.getElementById('dovakoDatePicker');
          if (picker) picker.classList.add('hidden');
          this.pickerTarget = null;
        },
        move(months) {
          const current = this.pickerMonth || new Date();
          this.pickerMonth = new Date(current.getFullYear(), current.getMonth() + Number(months || 0), 1);
          this.renderPicker();
        },
        setPeriod(year, monthIndex) {
          this.pickerMonth = new Date(Number(year), Number(monthIndex), 1);
          this.renderPicker();
        },
        availableYears(selectedYear) {
          const currentYear = new Date().getFullYear();
          const firstYear = Math.min(1920, Number(selectedYear) || currentYear);
          const lastYear = Math.max(currentYear + 10, Number(selectedYear) || currentYear);
          const years = [];
          for (let year = lastYear; year >= firstYear; year -= 1) years.push(year);
          return years;
        },
        renderPicker() {
          const month = this.pickerMonth || new Date();
          const year = month.getFullYear();
          const monthIndex = month.getMonth();
          const selected = this.iso(this.pickerTarget && this.pickerTarget.value);
          const today = this.todayIso();
          const monthSelect = document.getElementById('dovakoDatePickerMonth');
          const yearSelect = document.getElementById('dovakoDatePickerYear');
          if (monthSelect && yearSelect) {
            monthSelect.innerHTML = Array.from({ length: 12 }, function (_, index) {
              return '<option value="' + index + '">Tháng ' + (index + 1) + '</option>';
            }).join('');
            yearSelect.innerHTML = this.availableYears(year).map(function (item) {
              return '<option value="' + item + '">' + item + '</option>';
            }).join('');
            monthSelect.value = String(monthIndex);
            yearSelect.value = String(year);
          }
          const cells = [];
          const firstDay = (new Date(year, monthIndex, 1).getDay() + 6) % 7;
          const days = new Date(year, monthIndex + 1, 0).getDate();
          for (let index = 0; index < firstDay; index += 1) cells.push('<td class="outside-month"></td>');
          for (let day = 1; day <= days; day += 1) {
            const key = year + '-' + this.pad(monthIndex + 1) + '-' + this.pad(day);
            const classes = [key === today ? 'today' : '', key === selected ? 'selected' : ''].filter(Boolean).join(' ');
            cells.push('<td><button type="button" class="' + classes + '" data-date="' + key + '">' + day + '</button></td>');
          }
          while (cells.length % 7) cells.push('<td class="outside-month"></td>');
          let rows = '';
          for (let index = 0; index < cells.length; index += 7) rows += '<tr>' + cells.slice(index, index + 7).join('') + '</tr>';
          document.getElementById('dovakoDatePickerDays').innerHTML = rows;
        },
        select(value) {
          if (!this.pickerTarget) return;
          this.pickerTarget.value = this.display(value);
          this.pickerTarget.dispatchEvent(new Event('change', { bubbles: true }));
          this.close();
        },
        clear() {
          if (!this.pickerTarget) return;
          this.pickerTarget.value = '';
          this.pickerTarget.dispatchEvent(new Event('change', { bubbles: true }));
          this.close();
        }
      };
      const app = {
        titles: {
          dashboard: ['Tổng quan', 'Vận hành hằng ngày'],
          customers: ['Khách hàng', 'Hồ sơ và lịch sử khách hàng'],
          bookings: ['Booking', 'Lịch hẹn và trạng thái phục vụ'],
          prepaid: ['Thẻ trả trước', 'Ưu đãi, số buổi còn lại và cảnh báo'],
          notices: ['Thông báo', 'Quy định, quy trình và chương trình khuyến mãi'],
          reports: ['Báo cáo', 'Doanh thu theo ngày, dịch vụ và nhân viên'],
          settings: ['Cài đặt', 'Danh mục nhân viên và dịch vụ']
        },
        applyPermissions(role) {
          document.querySelectorAll('[data-roles]').forEach(function (element) {
            const roles = String(element.dataset.roles || '').split(',');
            element.classList.toggle('hidden', roles.indexOf(role) === -1);
          });
        },
        navigate(viewName) {
          document.querySelectorAll('.view').forEach(function (view) {
            view.classList.toggle('active-view', view.id === 'view-' + viewName);
          });
          document.querySelectorAll('.nav-item').forEach(function (item) {
            item.classList.toggle('active', item.dataset.view === viewName);
          });
          document.getElementById('pageTitle').textContent = this.titles[viewName][0];
          document.getElementById('pageEyebrow').textContent = this.titles[viewName][1];
          if (viewName === 'dashboard') this.loadDashboard();
          if (viewName === 'customers') loadCustomers();
          if (viewName === 'bookings') loadBookingScreen();
          if (viewName === 'prepaid') loadPrepaidScreen();
          if (viewName === 'notices') loadNotices();
          if (viewName === 'reports') loadReports();
          if (viewName === 'settings') loadSettings();
        },
        loadDashboard() {
          document.getElementById('dashboardCards').innerHTML = '<div class="loading-card">Đang tải tổng quan...</div>';
          apiCall('getDashboard', [], this.renderDashboard.bind(this), this.handleError.bind(this));
        },
        renderDashboard(data) {
          const revenue = data.revenue || {};
          const booking = data.bookings || {};
          const customers = data.customers || {};
          const prepaid = data.prepaid || {};
          const cards = [
            ['Doanh thu hôm nay', this.currency(revenue.today), 'Gồm tiền mua thẻ trả trước'],
            ['Doanh thu tuần', this.currency(revenue.week), 'Từ thứ Hai đến Chủ nhật'],
            ['Doanh thu tháng', this.currency(revenue.month), 'Tháng hiện tại'],
            ['Booking hôm nay', booking.activeToday || 0, (booking.pendingConfirmation || 0) + ' lịch chưa xác nhận'],
            ['Khách mới hôm nay', customers.newToday || 0, 'Tổng hồ sơ: ' + (customers.total || 0) + ' · VIP: ' + (customers.vip || 0)],
            ['Đang phục vụ', booking.serving || 0, 'Đã hoàn thành: ' + (booking.completed || 0)],
            ['Thẻ sắp hết', (prepaid.nearEnd || []).length, 'Đang dùng: ' + (prepaid.activeCards || 0) + ' thẻ']
          ];
          document.getElementById('dashboardCards').innerHTML = cards.map(function (card) {
            return '<article class="metric-card"><p>' + app.escape(card[0]) + '</p><strong>' + app.escape(card[1]) + '</strong><span>' + app.escape(card[2]) + '</span></article>';
          }).join('');
          const alerts = prepaid.nearEnd || [];
          const alertBox = document.getElementById('dashboardPrepaidAlerts');
          alertBox.classList.toggle('hidden', !alerts.length);
          alertBox.textContent = alerts.length ? 'Cảnh báo thẻ gần hết: ' + alerts.map(function (card) {
            return card.CustomerName + ' (' + card.ServiceName + ') còn ' + (card.CardMode === 'Value' ? app.currency(card.RemainingValue) : card.RemainingSessions + ' buổi');
          }).join('; ') : '';
          const schedule = data.todaySchedule || [];
          document.getElementById('todaySchedule').innerHTML = schedule.length ? schedule.map(function (item) {
            return '<article class="schedule-item"><time>' + app.escape(item.StartTime) + '</time><div><strong>' + app.escape(item.CustomerName) + '</strong><p>' + app.escape(item.ServiceID) + ' · Giường ' + app.escape(item.BedID) + '</p></div><span class="status-chip">' + app.escape(item.Status) + '</span></article>';
          }).join('') : '<div class="empty-state">Chưa có booking nào hôm nay.</div>';
        },
        handleError(error) {
          const message = error && error.message ? error.message : 'Đã xảy ra lỗi. Vui lòng thử lại.';
          this.toast(message, 'error');
          document.getElementById('dashboardCards').innerHTML = '<div class="empty-state">Không tải được dữ liệu tổng quan.</div>';
        },
        toast(message, type) {
          const toast = document.getElementById('toast');
          toast.textContent = message;
          toast.className = 'toast show ' + (type || 'success');
          window.clearTimeout(this.toastTimer);
          this.toastTimer = window.setTimeout(function () { toast.className = 'toast'; }, 3500);
        },
        currency(value) {
          return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND', maximumFractionDigits: 0 }).format(Number(value || 0));
        },
        escape(value) {
          return String(value === null || value === undefined ? '' : value)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }
      };
      document.getElementById('todayLabel').textContent = new Intl.DateTimeFormat('vi-VN', { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' }).format(new Date());
      document.addEventListener('DOMContentLoaded', function () { dateUi.bind(); authUi.bootstrap(); });
    </script>
